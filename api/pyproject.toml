[project]
name = "form2json-api"
version = "0.1.0"
description = "Local API for the athletics finish-record conversion demo"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0",
  "httpx>=0.28.0",
  "numpy>=2.2.0",
  "opencv-python-headless>=4.11.0",
  "pillow>=11.0.0",
  "python-dotenv>=1.2.0",
  "python-multipart>=0.0.20",
  "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
